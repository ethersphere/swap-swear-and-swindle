testMode: property

# Longer sequences help the stateful swap/factory flows reach richer states.
seqLen: 320

# Stateful campaigns need enough budget to discover deploy/deposit/prepare/decrease
# interactions across multiple actors.
testLimit: 60000

# Shrinking a counterexample can be much slower than fuzzing.
shrinkLimit: 1000

# Useful while iterating on invariants.
coverage: true

# The swap harnesses use timestamp-based hard-deposit delays, so keep time moving
# enough to unlock decrease paths without introducing giant jumps.
maxTimeDelay: 16
maxBlockDelay: 16

workers: 4
format: text

# Keep the harness deployment address stable so signature-aware fixtures can
# precompute downstream contract addresses deterministically.
contractAddr: "0x00a329c0648769A73afAc7F9381E08FB43dBEA72"

cryticArgs:
  - "--compile-force-framework"
  - "hardhat"
  - "--hardhat-ignore-compile"
